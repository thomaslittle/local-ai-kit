name: Native SDK and package verification
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux runner)
        if: runner.os == 'Linux'
        run: |
          # The debug test build plus the release bundle exceed the default runner disk.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Install build-only dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r scripts/requirements-build.txt
          npx --no-install playwright install --with-deps chromium
      - name: Full deterministic verification (no provider inference)
        run: python scripts/verify.py --profile all
      - name: Plain HTTP C# consumer
        run: python scripts/test_dotnet.py
      - name: Formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build local artifacts and exercise clean consumers
        run: |
          python scripts/build_release.py --profile release
          python scripts/package_smoke.py
      - name: Preserve actual evidence and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.os }}
          path: |
            .verification/verify-last.json
            .verification/package-smoke.json
            .verification/adapter-conformance.json
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/latest.json
          if-no-files-found: warn
