[package]
name = "lai-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "local-ai-kit"
path = "src/main.rs"

[dependencies]
lai-kit = { path = "../lai-kit" }
lai-adapters = { path = "../lai-adapters" }
lai-contracts = { path = "../lai-contracts" }
lai-core = { path = "../lai-core" }
lai-discovery = { path = "../lai-discovery" }
lai-platform = { path = "../lai-platform" }
lai-service = { path = "../lai-service" }
lai-transports = { path = "../lai-transports" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "signal", "macros", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "local-ai-kit-native-host"
path = "src/native_main.rs"

[[bin]]
name = "local-ai-kit-auth-blocker"
path = "src/auth_blocker.rs"
