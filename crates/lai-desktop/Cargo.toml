[package]
name = "lai-desktop"
version = "0.1.0-alpha.18"
edition = "2024"
license = "MIT"
publish = false
description = "Native GPUI desktop manager for Local AI Kit"

[[bin]]
name = "local-ai-kit-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.8.1", features = ["gpui-fast"] }
lai-control = { path = "../lai-control" }
lai-contracts = { path = "../lai-contracts" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"
