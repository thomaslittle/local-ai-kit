[package]
name = "lai-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
os-notifications = ["dep:notify-rust"]

[dependencies]
lai-runtime = { path = "../lai-runtime" }
lai-contracts = { path = "../lai-contracts" }
lai-core = { path = "../lai-core" }
lai-discovery = { path = "../lai-discovery" }
lai-platform = { path = "../lai-platform" }
lai-chatgpt-auth = { path = "../lai-chatgpt-auth" }
lai-store = { path = "../lai-store" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
getrandom = "0.3"
base64 = "0.22"
ring = "0.17"
notify-rust = { version = "4.18.2", optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
