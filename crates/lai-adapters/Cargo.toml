[package]
name = "lai-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled", "limits"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
zeroize = "1"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
lai-runtime = { path = "../lai-runtime" }
lai-contracts = { path = "../lai-contracts" }
lai-discovery = { path = "../lai-discovery" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tempfile = "3"
getrandom = "0.4"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
lai-platform = { path = "../lai-platform" }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8.9"
