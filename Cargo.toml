[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.11"
edition = "2024"
license = "MIT"
repository = "https://github.com/thomaslittle/local-ai-kit"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
sha2 = "0.10"
bigdecimal = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
